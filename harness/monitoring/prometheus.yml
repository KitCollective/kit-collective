global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: harness_health
    metrics_path: /probe
    params:
      module: [harness_health]
      target: [http://webhook:8080/health]
    static_configs:
      - targets: ["json_exporter:7979"]
    relabel_configs:
      - source_labels: [__param_target]
        target_label: instance
