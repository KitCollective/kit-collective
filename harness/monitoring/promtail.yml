server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: harness_webhook
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=webhook"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: harness_webhook
    pipeline_stages:
      - docker: {}
      - static_labels:
          compose_service: webhook
          job: harness_webhook
      - regex:
          expression: "^(?P<harness_json>\\{.*\\})\\s*$"
      - json:
          expressions:
            source: source
            role: role
            identifier: identifier
            event: event
            gate: gate
            loopRisk: loopRisk
            error: error
            phase: phase
            stopPoint: stopPoint
            tool: tool
            detail: detail
            tokensIn: tokensIn
            tokensOut: tokensOut
          source: harness_json
      - labels:
          role:
          kit: identifier
          event:
          gate:
          phase:
