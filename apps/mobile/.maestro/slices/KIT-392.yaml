# Device flow for KIT-392: the Søg field takes Back in focus (ADR-0049).
#
# design-sections: Search field, Søg home and typeahead, Icon button
#
# AC 1: in focus Back (Tilbage) replaces the search icon, clear stays on the right.
# AC 2: Back returns to Søg home (the title and the magazine come back).
# AC 3: clear empties the field.
# AC 4 (accessible name, test) is covered by tests/search-field-discover-chrome.test.ts.
appId: app.kitcollective.mobile
name: kit-392
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__kit-392
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- assertVisible:
    id: search-back
- assertVisible:
    id: search-clear
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-392__00-back-and-clear-in-focus
# AC 3: clear empties the field; the field stays in focus, so Back stays.
- tapOn:
    id: search-clear
- assertNotVisible:
    id: search-clear
- assertVisible:
    id: search-back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-392__01-clear-empties-the-field
# AC 2: Back returns to Søg home with the search icon back and the field out of focus.
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- tapOn:
    id: search-back
- extendedWaitUntil:
    visible:
      id: magazine-shelf-.*
    timeout: 15000
- assertNotVisible:
    id: search-back
- assertNotVisible:
    id: typeahead-list
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-392__02-back-returns-to-search-home
- stopRecording
