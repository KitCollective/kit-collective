# KIT-290: another Collector's UserJersey in the new column (Revision 2026-10-10).
#
# design-sections: Foreign UserJersey detail, Button dock, Avatar, Sheet, Tab bar
#
# The fixed test data holds ONE foreign jersey: OB (...0105), owned by e2e_peer, åben for bud, with
# two photos, no player and no badge. This flow therefore shows AC 1-3, 5, 6, 10 and 12, the More
# Sheet (AC 2) and the owner row opening Peer Profil (AC 6).
#
# Not shown by a screen, and proved by pure tests instead (apps/mobile/tests/
# foreign-jersey-view-model.test.ts and foreign-jersey-dock.test.ts):
# - the player row (AC 4) and the Badge fact row (AC 5): the fixture jersey has neither.
# - a jersey that is not åben for bud, which has no dock (AC 11): the fixture has none. Per
#   Nicklas's comment of 2026-10-10 the issue ships no dock there; Skriv til handle is KIT-298.
# - the API cases (AC 7-9, 13) are proved by the API suites.
#
# AC 10: Send bud is opened from inside the detail and Back returns to it. The submit and the
# amount entry are regression/search-bid.yaml's.
appId: app.kitcollective.mobile
name: kit-290
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__kit-290
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
# The second test Collector's jersey is on this catalog side.
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- hideKeyboard
- tapOn:
    id: typeahead-hit-club-.*
- extendedWaitUntil:
    visible:
      id: jersey-tile-e2e00000-0000-4000-8000-000000000105
    timeout: 15000
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000105
- extendedWaitUntil:
    visible:
      id: send-bid-open
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
# AC 1, 2, 3, 12: the 4:5 photo with the count pill and Back, Favorit and More over it, no thumb
# strip and no bottom sheet; under it the title block (type · Åben for bud, OB in display, the
# season in numeral); no Tab bar; the Send bud dock at the bottom.
- takeScreenshot: kc__kit-290__01-photo-and-title-block
# AC 5, 6: the fact rows (Størrelse, Stand; no Badge row), then the owner last: Ejer, the Avatar,
# the Handle, city · n trøjer (no city when Vis by is off) and a chevron.
# The owner row sits in the screen's bounds before it is scrolled clear of the dock, so
# scrollUntilVisible would stop at once: scroll the column down the one step it has.
- scroll
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-290__02-fact-rows-and-owner
# AC 10: the dock shows Button primary Send bud at the bottom with a hairline above it.
- assertVisible:
    id: send-bid-open
- tapOn:
    id: send-bid-open
- extendedWaitUntil:
    visible:
      id: bid-amount
    timeout: 15000
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-290__02b-send-bid-opened-from-detail
- tapOn: Tilbage
- extendedWaitUntil:
    visible:
      id: send-bid-open
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
# AC 2: More opens a Sheet with Rapportér and Blokér.
- scrollUntilVisible:
    element:
      id: jersey-detail-more
    direction: UP
- tapOn:
    id: jersey-detail-more
- extendedWaitUntil:
    visible:
      id: foreign-jersey-report
    timeout: 10000
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-290__03-more-sheet
# The scrim above the Sheet closes it.
- tapOn:
    point: 50%,8%
- extendedWaitUntil:
    notVisible:
      id: foreign-jersey-report
    timeout: 10000
# AC 6: the owner row opens Peer Profil.
- scroll
- runFlow: ../subflows/settle.yaml
- tapOn:
    id: foreign-jersey-owner-row
# Peer Profil lists the owner's one jersey (OB) in a tile whose caption the detail does not have.
# The tile is one accessible element labelled "OB, 2023/24 · Hjemme", so match the caption inside it.
- extendedWaitUntil:
    visible: ".*2023/24 · Hjemme.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-290__04-owner-opens-peer-profil
- stopRecording
