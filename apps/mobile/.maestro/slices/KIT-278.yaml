# KIT-278: the first-session device flows (ADR-0049): the first session, a returning collector
# and the designed error states, in one run.
#
# design-sections: Button, Button dock, Sheet, Text field, Banner, Toast, Logo
#
# Signed-out slice: it resets the data and launches with clearState, as sign-in.yaml does.
# The local API's recording mailer hands the flow the six-digit code (sign-in-code.js), and can
# let it expire, so no real mail is sent. The fixed failing inputs of the error flow are
# "not-an-email" (invalid e-mail), a code that is not the mailed one (wrong code) and the mailed
# code after EXPIRE (expired code).
# The flows run with Reduce Motion on (run-local.sh), so the demo and the wall are still and
# every screenshot is the same frame on every run.
# Not shown by a screen: the removed onboarding slides, door switcher and password screens (AC 4)
# are proved by the absence assertions below and by KIT-276's tests.
appId: app.kitcollective.mobile
name: kit-278
env:
  NEW_EMAIL: new-collector@test.kitcollective
---
# ---- First session: welcome, Vision at work, result, Kom i gang, code, Samling ----
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: kc__kit-278
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
# AC 1: welcome. AC 4: no onboarding slides, door switcher or password field.
- assertVisible:
    id: welcome-example-example-1
- assertNotVisible: "Adgangskode|Password|Login|Opret"
- takeScreenshot: kc__kit-278__01-welcome
# AC 1: Vision at work. The first row has resolved and the others are still skeletons.
- tapOn:
    id: welcome-example-example-1
- extendedWaitUntil:
    visible: "Pladsholder FC"
    timeout: 20000
- takeScreenshot: kc__kit-278__02-vision-at-work
# AC 1: the result, every row resolved and the example marked as an example.
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "2023/24"
- takeScreenshot: kc__kit-278__03-result
# AC 1: Kom i gang, the one sheet.
- tapOn:
    id: demo-start
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: door-email
- assertNotVisible:
    id: door-password
- assertNotVisible:
    id: door-mode-login
- takeScreenshot: kc__kit-278__04-kom-i-gang
# AC 1: code. A new e-mail, six boxes, no submit button.
- tapOn:
    id: door-email
- inputText: ${NEW_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: code-box-5
- takeScreenshot: kc__kit-278__05-code
# AC 1: Samling after the correct code, a new collector with the one inviting slot.
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${NEW_EMAIL}
      EXPIRE: "false"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-278__06-samling
# ---- Returning collector: welcome, Jeg har allerede en konto, e-mail, code, Samling ----
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
# AC 2: Jeg har allerede en konto opens the same Kom i gang sheet.
- tapOn:
    id: welcome-have-account
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-278__07-returning-sheet
- tapOn:
    id: door-email
- inputText: ${MAESTRO_COLLECTOR_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-278__08-returning-code
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      EXPIRE: "false"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# AC 2: the same Samling, now with the collector's jerseys.
- assertNotVisible:
    id: collection-first-slot
- takeScreenshot: kc__kit-278__09-returning-samling-with-jerseys
# ---- Error states: invalid e-mail, wrong code, expired code ----
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- tapOn:
    id: welcome-have-account
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 10000
- tapOn:
    id: door-email
- inputText: not-an-email
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: door-email-error
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
# AC 3: invalid e-mail, inline under the field, no code sent.
- assertNotVisible:
    id: code-screen
# The focused field blinks its caret, so the keyboard goes away before the frame is stored.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kc__kit-278__10-error-invalid-email
- tapOn:
    id: door-email
- eraseText: 40
- inputText: ${MAESTRO_COLLECTOR_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      EXPIRE: "false"
- inputText: ${output.wrong}
- extendedWaitUntil:
    visible:
      id: code-error
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# AC 3: wrong code, the boxes clear and the error shows.
- takeScreenshot: kc__kit-278__11-error-wrong-code
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      EXPIRE: "true"
- inputText: ${output.code}
- extendedWaitUntil:
    visible: "Send ny kode"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# AC 3: expired code, Send ny kode.
- takeScreenshot: kc__kit-278__12-error-expired-code
- stopRecording
