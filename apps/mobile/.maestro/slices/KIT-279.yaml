# Device flow for KIT-279: confirm on one screen (ADR-0049).
# design-sections: Confirm and Save, Chip, Button dock, Photo lightbox
appId: app.kitcollective.mobile
name: kit-279
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      PASSWORD: ${MAESTRO_COLLECTOR_PASSWORD}
- startRecording: kc__kit-279
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids: the first cell by point, then Done by its text. The
# banner subflow first closes iOS's Private Access banner, which moves the grid.
- runFlow: ../subflows/photo-picker-banner.yaml
- tapOn:
    point: 16%,25%
# Tap the picker's Done once it is enabled, and again while it still shows (the reason is in
# regression/add-jersey.yaml).
- runFlow: ../subflows/photo-picker-done.yaml
# AC 1: Resolved identity block with Ret, size and condition chips on the hub,
# AC 8/9: photo strip shows the filled slot plus one Foto tile, index in header.
- extendedWaitUntil:
    visible:
      id: confirm-identity-resolved
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__01-identity-resolved
# AC 5/6/7: size and condition chosen on the hub, Gem enables.
- tapOn:
    id: detail-size-m
- tapOn:
    id: detail-condition-used
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__02-size-condition-ready
# AC 5: Detaljer holds only Badge and Noter, behind the optional row.
- tapOn:
    id: confirm-section-details
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__03-details-badge-notes
- tapOn:
    id: confirm-details-save
- extendedWaitUntil:
    visible:
      id: jersey-index-add
    timeout: 10000
# AC 4, 9: a second jersey is added: the index moves to its own row with the
# photo count, and the new jersey shows the empty identity block.
- tapOn:
    id: jersey-index-add
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__04-two-jerseys-empty-identity
- stopRecording
