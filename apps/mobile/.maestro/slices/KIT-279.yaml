# Device flow for KIT-279: confirm on one screen (ADR-0049).
# design-sections: Confirm and Save, Chip, Button dock, Photo lightbox
appId: app.kitcollective.mobile
name: kit-279
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      PASSWORD: ${MAESTRO_COLLECTOR_PASSWORD}
- startRecording: kc__kit-279
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids: the first cell, then confirm.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- tapOn:
    point: 90%,12%
# AC 1: Resolved identity block with Ret, size and condition chips on the hub,
# AC 8/9: photo strip shows the filled slot plus one Foto tile, index in header.
- extendedWaitUntil:
    visible:
      id: confirm-identity-resolved
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__01-identity-resolved
# AC 5/6/7: size and condition chosen on the hub, Gem enables.
- tapOn:
    id: detail-size-m
- tapOn:
    id: detail-condition-used
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__02-size-condition-ready
# AC 5: Detaljer holds only Badge and Noter, behind the optional row.
- tapOn:
    id: confirm-section-details
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__03-details-badge-notes
- tapOn:
    id: confirm-details-save
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
# AC 6: save, then add the next jersey: the last size is pre-selected, condition is not.
- tapOn:
    id: confirm-save
- extendedWaitUntil:
    visible:
      id: post-save-next
    timeout: 30000
- tapOn:
    id: post-save-next
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 15000
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- tapOn:
    point: 90%,12%
- extendedWaitUntil:
    visible:
      id: confirm-identity-resolved
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__04-sticky-size-next-jersey
# AC 4, 9: a second jersey is added: the index moves to its own row with the
# photo count, and the new jersey shows the empty identity block.
- tapOn:
    id: jersey-index-add
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-279__05-two-jerseys-empty-identity
- stopRecording
