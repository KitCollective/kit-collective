# KIT-298: a message to a Collector without a Bud.
#
# design-sections: Conversation, Message composer, Foreign UserJersey detail, Button dock, Icon button, Avatar, Own Profil
#
# FIXTURE THIS FLOW READS (apps/api/src/e2e/test-data.fixture.ts): the fixed data holds ONE foreign
# jersey, OB (...0105), owned by e2e_peer and åben for bud; the Test Collector already has a
# Conversation with e2e_peer (...0501, two pending Buds). No fixture Collector is without a
# Conversation, and the fixture is outside this issue's write-scope, so the flow makes the empty
# thread itself: the Test Collector deletes the Conversation for himself (Slet samtale), after which
# the peer lookup answers `conversationId: null` and the thread opens empty. The first message
# brings the hidden Conversation back (it is the one Conversation of the pair).
#
# Two Collectors sign in, the test data is reset only before the first:
# 1. The Test Collector: Slet samtale on the thread with e2e_peer; the foreign OB jersey with the
#    message Icon button beside Send bud; the empty thread with the jersey reference; the reference
#    dismissed; the thread opened again from the jersey and a first message sent with the reference;
#    the thread under Samtaler.
# 2. e2e_peer (no data reset): the receiver's read-only reference above the bubble; åben for bud
#    turned off on OB.
# Then the Test Collector signs in again (no data reset): the OB jersey with Skriv til e2e_peer
# alone, and Peer Profil's Skriv besked, which opens the existing Conversation.
#
# Not on a screen here, proved by tests instead: the first message creating the Conversation, the
# refusals (self, blocked, private jersey, a jersey of another Collector) and the hidden thread
# returning (apps/api/tests/conversation-start.test.ts); the view-model copy and the send body
# (apps/mobile/tests/thread-view-model.test.ts); the dock, Peer Profil and composer wiring
# (apps/mobile/tests/message-without-bud-chrome.test.ts).
#
# Taps are by testID: foreign-jersey-write (the 54px message Icon button, or the Button alone),
# peer-profile-write, composer-jersey-reference(-dismiss), composer-input, composer-send,
# thread-start. Two kinds of tap are not by testID: the tab bar (as in every flow) and the Thread
# row, which has none (as in KIT-295 and KIT-297); and Tilbage in the thread header, an Icon button
# with no testID in the conversation header.
appId: app.kitcollective.mobile
name: kit-298
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__kit-298
# ---- The Test Collector deletes the thread with e2e_peer for himself (no screenshots) ----
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Indbakke
- extendedWaitUntil:
    visible: "e2e_peer, .*"
    timeout: 15000
- tapOn: "e2e_peer, .*"
- extendedWaitUntil:
    visible:
      id: conversation-header
    timeout: 15000
- tapOn:
    id: conversation-more
- extendedWaitUntil:
    visible:
      id: conversation-more-delete
    timeout: 15000
- tapOn:
    id: conversation-more-delete
- extendedWaitUntil:
    visible:
      id: conversation-confirm-submit
    timeout: 15000
- tapOn:
    id: conversation-confirm-submit
- extendedWaitUntil:
    notVisible:
      id: conversation-header
    timeout: 15000
# ---- Søg to the OB jersey of e2e_peer ----
# The first tab press can be swallowed while the tab settles on the hosted simulator (KIT-291).
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 8000
    optional: true
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- hideKeyboard
- tapOn:
    id: typeahead-hit-club-.*
- extendedWaitUntil:
    visible:
      id: jersey-tile-e2e00000-0000-4000-8000-000000000105
    timeout: 15000
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000105
- extendedWaitUntil:
    visible:
      id: send-bid-open
    timeout: 15000
- runFlow: ../subflows/settle.yaml
# AC 1: the OB jersey is åben for bud with no bid from this Collector: a 54px secondary message
# Icon button (name "Skriv til e2e_peer") beside primary Send bud.
- takeScreenshot: kc__kit-298__01-dock-message-button-beside-send-bud
- tapOn:
    id: foreign-jersey-write
- extendedWaitUntil:
    visible:
      id: thread-start
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: composer-jersey-reference
    timeout: 15000
- runFlow: ../subflows/settle.yaml
# AC 4, 5, 6: the empty thread with that Collector, opened from the jersey: the Handle and the
# initial centred (64px Avatar, no photo), city · n trøjer, and above the field the jersey
# reference (32 × 40 thumb, Om trøjen, club and season, dismiss).
- takeScreenshot: kc__kit-298__02-empty-thread-with-jersey-reference
- tapOn:
    id: composer-jersey-reference-dismiss
- extendedWaitUntil:
    notVisible:
      id: composer-jersey-reference
    timeout: 5000
- runFlow: ../subflows/settle.yaml
# AC 6: dismissing removes the reference; the composer is the plain field again.
- takeScreenshot: kc__kit-298__03-reference-dismissed
# ---- Back to the jersey, the thread opened again with the reference ----
- tapOn: Tilbage
- extendedWaitUntil:
    notVisible:
      id: thread-start
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- eraseText: 20
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- hideKeyboard
- tapOn:
    id: typeahead-hit-club-.*
- extendedWaitUntil:
    visible:
      id: jersey-tile-e2e00000-0000-4000-8000-000000000105
    timeout: 15000
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000105
- extendedWaitUntil:
    visible:
      id: foreign-jersey-write
    timeout: 15000
- tapOn:
    id: foreign-jersey-write
- extendedWaitUntil:
    visible:
      id: composer-jersey-reference
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: "Hej, har du den i M også?"
- hideKeyboard
- runFlow: ../subflows/settle.yaml
# AC 7: the reference is still shown with the first message ready to go with it.
- takeScreenshot: kc__kit-298__04-first-message-with-reference
- tapOn:
    id: composer-send
# The Conversation opens in place of the empty thread.
- extendedWaitUntil:
    visible:
      id: conversation-header
    timeout: 15000
- extendedWaitUntil:
    visible: "Hej, har du den i M også\\?"
    timeout: 15000
- runFlow: ../subflows/settle.yaml
# AC 7: the sender's own bubble carries the read-only reference (Om trøjen, the jersey) above it,
# and the composer's reference is gone after the send.
- assertNotVisible:
    id: composer-jersey-reference
- takeScreenshot: kc__kit-298__05-sent-message-keeps-reference-above-bubble
# The new thread is under Samtaler after the first message.
- tapOn: Tilbage
- extendedWaitUntil:
    visible: "e2e_peer, .*"
    timeout: 15000
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-298__06-thread-under-samtaler
# ---- e2e_peer signs in (no data reset: the message must stay) ----
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- tapOn:
    id: welcome-have-account
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 60000
- tapOn:
    id: door-email
- inputText: ${MAESTRO_PEER_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 60000
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${MAESTRO_PEER_EMAIL}
      EXPIRE: "false"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Indbakke
- extendedWaitUntil:
    visible: "e2e_collector, .*"
    timeout: 15000
- tapOn: "e2e_collector, .*"
- extendedWaitUntil:
    visible:
      id: conversation-header
    timeout: 15000
- scrollUntilVisible:
    element: "Hej, har du den i M også\\?"
    centerElement: false
- runFlow: ../subflows/settle.yaml
# AC 7: the receiver sees which jersey the message is about, above the bubble (a read-only row:
# the Chat bubble has no jersey slot, a lock gap flagged in the PR).
- assertVisible: "Om trøjen"
- takeScreenshot: kc__kit-298__07-receiver-sees-the-jersey-it-is-about
# ---- e2e_peer turns åben for bud off on OB, so the foreign dock has Skriv til alone ----
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: collection-facts
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000105
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: jersey-detail-own
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: jersey-detail-bidding
    centerElement: false
- tapOn:
    id: jersey-detail-bidding
- runFlow: ../subflows/settle.yaml
# ---- The Test Collector signs in again (no data reset) ----
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- tapOn:
    id: welcome-have-account
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 60000
- tapOn:
    id: door-email
- inputText: ${MAESTRO_COLLECTOR_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 60000
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      EXPIRE: "false"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 8000
    optional: true
- tapOn: Søg
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: OB
- extendedWaitUntil:
    visible:
      id: typeahead-list
    timeout: 15000
- hideKeyboard
- tapOn:
    id: typeahead-hit-club-.*
- extendedWaitUntil:
    visible:
      id: jersey-tile-e2e00000-0000-4000-8000-000000000105
    timeout: 15000
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000105
- extendedWaitUntil:
    visible:
      id: foreign-jersey-write
    timeout: 15000
- assertNotVisible:
    id: send-bid-open
- runFlow: ../subflows/settle.yaml
# AC 2: the jersey is not åben for bud: secondary Skriv til e2e_peer alone, no Send bud.
- takeScreenshot: kc__kit-298__08-dock-skriv-til-alone
# AC 3: Peer Profil (the owner row) holds one primary Skriv besked under the identity block.
- scrollUntilVisible:
    element:
      id: foreign-jersey-owner-row
    centerElement: true
- tapOn:
    id: foreign-jersey-owner-row
- extendedWaitUntil:
    visible:
      id: peer-profile-write
    timeout: 15000
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-298__09-peer-profil-skriv-besked
# AC 4: Skriv besked opens the existing Conversation with e2e_peer, not an empty thread.
- tapOn:
    id: peer-profile-write
- extendedWaitUntil:
    visible:
      id: conversation-header
    timeout: 15000
- assertNotVisible:
    id: thread-start
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__kit-298__10-skriv-besked-opens-existing-conversation
- stopRecording
