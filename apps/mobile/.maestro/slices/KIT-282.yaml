# Device flow for KIT-282: the bulk overview and the parked session (ADR-0049).
# design-sections: Capture session, Confirm and Save, Button dock, List row
#
# Needs a simulator photo library with FOUR OR MORE photos (simulator.sh adds one today) and
# a fixed Vision grouping that returns more than one group, one of them below 70 and one below 50,
# so that Tjek and the inbox row show. Neither exists yet; see the KIT-282 workpad.
appId: app.kitcollective.mobile
name: kit-282
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      PASSWORD: ${MAESTRO_COLLECTOR_PASSWORD}
- startRecording: kc__kit-282
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids: four cells, then confirm.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- tapOn:
    point: 50%,25%
- tapOn:
    point: 83%,25%
- tapOn:
    point: 16%,40%
- tapOn:
    point: 90%,12%
# AC 3, 4: four or more photos with Vision on open the overview, titled Sorterer n fotos,
# with a progress bar and the dock usable.
- extendedWaitUntil:
    visible:
      id: overview-title
    timeout: 30000
- takeScreenshot: kc__kit-282__01-sorting-in-flight
# AC 3, 5: when grouping is done the title reads n trøjer fundet and the rows are sorted
# Tjek first, then Str. og stand, then Gemt, each with its trailing status.
- extendedWaitUntil:
    notVisible:
      id: overview-progress
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: overview-row-0
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-282__02-jerseys-found-sorted
# AC 6: Gennemgå opens Confirm for the first unsaved draft; the dock reads Gem og næste.
- tapOn:
    id: overview-primary
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-282__03-confirm-first-unsaved
# AC 8: Luk parks the session and Samling shows ONE parked row (Fortsæt).
- tapOn:
    id: confirm-close
- extendedWaitUntil:
    visible:
      id: collection-parked-row
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-282__04-samling-parked-row
# AC 8: the parked row reopens the overview and goes while it is open.
- tapOn:
    id: collection-parked-row
- extendedWaitUntil:
    visible:
      id: overview-title
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-282__05-overview-reopened
- stopRecording
