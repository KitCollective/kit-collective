# Device flow for KIT-383: the own-jersey detail tells a failed load from a missing jersey (ADR-0049).
#
# Steps: a jersey that loads, one absent from the list ("Trøjen findes ikke"), and a jersey that
# exists but whose load fails. The failure is staged by resetting the test data mid-flow: the reset
# deletes the Collector's sessions, so the app's next list fetch answers 401 while jersey 0101 is
# seeded again. The error matrix (404, 401, 5xx, network, parse) is covered by
# tests/jersey-detail-load.test.ts, which tests the pure loadOwnJersey only.
# Retry (AC 2): the last step taps "Prøv igen" and shows the load running again. A SUCCESSFUL retry
# cannot be staged: the app keeps the token of the deleted session, so the list keeps answering 401,
# and a Device flow has no way to give the app a new session mid-flow. What a retry does on success
# (retryLoad -> load -> found) is therefore covered by no automated test.
# design-sections: Banner, Own UserJersey detail
appId: app.kitcollective.mobile
name: kit-383
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__kit-383
# Baseline (no criterion of its own): a jersey that is in the list loads and shows on the detail.
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000101
- extendedWaitUntil:
    visible:
      id: jersey-detail-own
    timeout: 15000
- assertNotVisible:
    id: jersey-detail-load-error
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__01-own-detail-loaded
# AC 3: a jersey that is absent from the answer is "Trøjen findes ikke", not a load error.
# The deep link must open a fresh detail: from a detail already on screen it only swaps the params.
- tapOn:
    id: jersey-detail-back
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 15000
- openLink: kitcollective:///collection/e2e00000-0000-4000-8000-0000000009ff
# iOS asks whether to open the link in the app, in the simulator's language.
- tapOn:
    text: "Åbn|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: jersey-detail-not-found
    timeout: 20000
- assertNotVisible:
    id: jersey-detail-load-error
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__02-not-found
# AC 1: the jersey exists, but the load fails (401 after the reset) -> load error, not "Trøjen findes ikke".
- tapOn:
    id: jersey-detail-back
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 15000
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
- openLink: kitcollective:///collection/e2e00000-0000-4000-8000-000000000101
- tapOn:
    text: "Åbn|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: jersey-detail-load-error
    timeout: 20000
- assertVisible:
    id: jersey-detail-load-retry
- assertNotVisible:
    id: jersey-detail-not-found
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__03-load-error
# AC 2 (retry, as far as it can be staged): "Prøv igen" re-runs the load; the session is still gone,
# so it fails again and the load-error state comes back. The success path is not staged (see header).
- tapOn:
    id: jersey-detail-load-retry
- extendedWaitUntil:
    visible:
      id: jersey-detail-load-error
    timeout: 20000
- assertNotVisible:
    id: jersey-detail-not-found
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__04-retry-fails-again
- stopRecording
