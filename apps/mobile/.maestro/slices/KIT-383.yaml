# Device flow for KIT-383: the own-jersey detail tells a failed load from a missing jersey (ADR-0049).
#
# The local API cannot be made to fail mid-flow, so the load-error state (AC 1, AC 2) has no step:
# its logic is covered by tests/jersey-detail-load.test.ts. This flow shows the two answers the
# screen can be given: a jersey that loads, and one that is absent from the list.
# design-sections: Banner, Own UserJersey detail
appId: app.kitcollective.mobile
name: kit-383
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__kit-383
# AC 2: a jersey that is in the list loads and shows on the detail, not an error.
- tapOn:
    id: jersey-tile-e2e00000-0000-4000-8000-000000000101
- extendedWaitUntil:
    visible:
      id: jersey-detail-own
    timeout: 15000
- assertNotVisible:
    id: jersey-detail-load-error
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__01-own-detail-loaded
# AC 3: a jersey that is absent from the answer is "Trøjen findes ikke", not a load error.
- openLink: kitcollective:///collection/e2e00000-0000-4000-8000-0000000009ff
# iOS asks whether to open the link in the app, in the simulator's language.
- tapOn:
    text: "Åbn|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: jersey-detail-not-found
    timeout: 20000
- assertNotVisible:
    id: jersey-detail-load-error
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__kit-383__02-not-found
- stopRecording
