# Tilføj trøje from the gallery, with the fixed Vision suggestion, through Save.
#
# Unfinished: the steps after the system photo picker (pick two photos, Bekræft
# with the Vision suggestion, Detaljer, Gem, Gemt, Samling) can only be written
# against a running simulator, and the app does not build yet (KIT-268). The
# testIDs they need are in place: confirm-section-details, detail-size-m,
# detail-condition-used, confirm-details-save, confirm-save, post-save-to-collection.
appId: app.kitcollective.mobile
name: add-jersey
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      PASSWORD: ${MAESTRO_COLLECTOR_PASSWORD}
- addMedia:
    - ../fixtures/shirt-back.jpg
    - ../fixtures/shirt-front.jpg
- startRecording: kc__add-jersey
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__01-source-sheet
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
- stopRecording
