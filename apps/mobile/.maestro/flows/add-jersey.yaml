# Tilføj trøje from the gallery, with the fixed Vision suggestion, through Save.
appId: app.kitcollective.mobile
name: add-jersey
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      PASSWORD: ${MAESTRO_COLLECTOR_PASSWORD}
- startRecording: kc__add-jersey
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__01-source-sheet
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids. The flows' simulator holds exactly
# one fixture photo, newest first: the first cell, then the confirm button.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- tapOn:
    point: 90%,12%
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: kc__add-jersey__02-confirm
- tapOn:
    id: confirm-section-details
- extendedWaitUntil:
    visible:
      id: confirm-details-save
    timeout: 10000
- tapOn:
    id: detail-size-m
- tapOn:
    id: detail-condition-used
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__03-details
- tapOn:
    id: confirm-details-save
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__04-ready-to-save
- tapOn:
    id: confirm-save
- extendedWaitUntil:
    visible:
      id: post-save-to-collection
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__05-saved
- tapOn:
    id: post-save-to-collection
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: kc__add-jersey__06-samling
- stopRecording
