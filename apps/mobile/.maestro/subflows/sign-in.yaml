# Cold start, known test data, signed in through the Kom i gang sheet with the e-mail code.
# Callers pass EMAIL (the collector's address). There is no password on this path.
# Callers may pass VISION, the fixed Vision answer for this run: resolved, low-confidence,
# mixed-grouping or failure (KIT-284). The header value below is the default when a caller passes
# none; a value the caller passes takes precedence over it.
appId: app.kitcollective.mobile
env:
  VISION: resolved
---
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      VISION: ${VISION}
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- tapOn:
    id: welcome-have-account
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 60000
- tapOn:
    id: door-email
- inputText: ${EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-screen
    timeout: 60000
# The local API's recording mailer holds the code; the sixth digit submits by itself.
- runScript:
    file: ../scripts/sign-in-code.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
      EMAIL: ${EMAIL}
      EXPIRE: "false"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
