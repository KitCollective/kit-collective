# Cold start, known test data, signed in through the legacy password screen. Callers pass EMAIL and PASSWORD.
appId: app.kitcollective.mobile
---
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
- launchApp:
    clearState: true
    clearKeychain: true
# The Kom i gang sheet has no password. Test accounts still sign in on the legacy
# password screen until the e-mail code lands (KIT-275) and the screen is removed (KIT-276).
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- openLink: kitcollective:///login
# iOS asks whether to open the link in the app, in the simulator's language.
- tapOn:
    text: "Åbn|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- tapOn:
    id: login-submit
# iOS offers to save the password in a system dialog, in the simulator's language.
- tapOn:
    text: "Ikke nu|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
