# Tilføj trøje with the Vision switch off on the start sheet (KIT-284): one photo lands on Confirm
# with the empty identity block ("Vision er slået fra", Vælg), and Vælg opens the Data drill.
# The flow stops at the opened drill and does not Save: add-jersey-vision-failure walks the drill
# and Saves by hand.
appId: app.kitcollective.mobile
name: add-jersey-vision-off
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__add-jersey-vision-off
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-vision-switch
    timeout: 15000
- tapOn:
    id: capture-vision-switch
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey-vision-off__01-sheet-vision-off
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids. The simulator's library holds the fixture photo,
# newest first, among the iOS sample photos: the first cell by point, then Done by its text. The
# banner subflow waits for the picker, pauses so a cold simulator has loaded its cells (the first
# flow of a run missed its taps in the first hosted run), and closes iOS's Private Access banner,
# which moves the grid.
- runFlow: ../subflows/photo-picker-banner.yaml
- tapOn:
    point: 16%,25%
- runFlow: ../subflows/photo-picker-done.yaml
# Vision off sends nothing, so the block is the empty one from the first frame.
- extendedWaitUntil:
    visible:
      id: confirm-identity-empty
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey-vision-off__02-empty-identity-block
# Vælg opens the Data drill, where club, season and type are chosen by hand.
- tapOn:
    id: confirm-identity-open
# The drill has no testID; its first row is the club select row (an assertion by copy, not a tap).
- extendedWaitUntil:
    visible: "Vælg klub eller landshold.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey-vision-off__03-data-drill
- stopRecording
