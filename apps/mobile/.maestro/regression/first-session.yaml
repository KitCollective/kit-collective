# First session as a Collector can reach it today: welcome, demo, Kom i gang, code step (stub until KIT-275).
appId: app.kitcollective.mobile
name: first-session
---
- runScript:
    file: ../scripts/reset-test-data.js
    env:
      API_URL: ${MAESTRO_API_URL}
      TEST_DATA_TOKEN: ${MAESTRO_TEST_DATA_TOKEN}
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: kc__first-session
- extendedWaitUntil:
    visible:
      id: welcome-have-account
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__first-session__01-welcome
- tapOn:
    id: welcome-example-example-1
- extendedWaitUntil:
    visible:
      id: demo-start
    timeout: 20000
# The actions are tappable from the first frame, so wait for the travel and the rows to settle.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: kc__first-session__02-demo-result
- tapOn:
    id: demo-start
- extendedWaitUntil:
    visible:
      id: door-submit
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__first-session__03-door
# An address that is not an e-mail shows the inline error and sends nothing.
- tapOn:
    id: door-email
- inputText: not-an-email
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: door-email-error
    timeout: 5000
- takeScreenshot: kc__first-session__04-door-invalid-email
- eraseText: 40
- inputText: ${MAESTRO_COLLECTOR_EMAIL}
- tapOn:
    id: door-submit
- extendedWaitUntil:
    visible:
      id: code-stub
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__first-session__05-code
- stopRecording
