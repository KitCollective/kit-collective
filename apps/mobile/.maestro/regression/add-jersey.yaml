# Tilføj trøje from the gallery, with the fixed Vision suggestion, through Save.
appId: app.kitcollective.mobile
name: add-jersey
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__add-jersey
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__01-source-sheet
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids. The simulator's library holds the
# fixture photo, newest first, among the iOS sample photos: the first cell, then
# the confirm button. On a slow hosted simulator the confirm tap can fire before
# the selection is live and is swallowed, leaving the picker open. So wait for
# the picker's selected footer (English: the hosted simulator's locale is fixed;
# optional, in case the hierarchy does not expose it), tap, and tap again while
# the picker still shows that footer. Never a retry keyed on Confirm not being
# visible: a stray tap at the confirm point would land on the Confirm hub.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- extendedWaitUntil:
    visible: 1 Photo
    timeout: 15000
    optional: true
- tapOn:
    point: 90%,12%
- repeat:
    while:
      visible: 1 Photo
    times: 3
    commands:
      - runFlow: ../subflows/settle.yaml
      - tapOn:
          point: 90%,12%
# Wait for the fixed Vision suggestion to land: a screenshot of the analysing
# state would differ from run to run.
- extendedWaitUntil:
    visible:
      id: confirm-identity-resolved
    timeout: 90000
# The picked photo binds to the front slot a moment after the suggestion lands.
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__02-confirm
# Size and condition sit on the hub now; the Detaljer drill only holds Badge and Noter.
- tapOn:
    id: detail-size-m
- tapOn:
    id: detail-condition-used
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__03-size-and-condition
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__04-ready-to-save
- tapOn:
    id: confirm-save
- extendedWaitUntil:
    visible:
      id: post-save-to-collection
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__05-saved
- tapOn:
    id: post-save-to-collection
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 15000
# Scroll to the end of the grid: straight after the Sheet closes, the system tab
# bar has not always noticed the content beneath it, and draws itself two ways.
- scroll
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__add-jersey__06-collection
- stopRecording
