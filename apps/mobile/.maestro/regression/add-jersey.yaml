# Tilføj trøje from the gallery, with the fixed Vision suggestion (identity block resolved,
# "Fundet af Vision"), size and condition on the hub, Gem, the Saved sheet, and Samling.
# The sibling flows add-jersey-low-confidence, add-jersey-vision-off and add-jersey-vision-failure
# cover the other states of the identity block.
appId: app.kitcollective.mobile
name: add-jersey
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
- startRecording: kc__add-jersey
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__01-source-sheet
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids. The simulator's library holds the
# fixture photo, newest first, among the iOS sample photos: the first cell by
# point, then Done by its text. iOS sometimes shows a "Private Access to Photos"
# banner that pushes the grid down about 162px, so the banner subflow waits for
# the picker, pauses so a cold simulator has loaded its cells, and closes the
# banner before the cell tap. The picker's Done stays disabled until a cell is
# selected, and on a slow hosted simulator a tap can fire before the selection
# is live and be swallowed, leaving the picker open. So the done subflow waits
# for an enabled Done (English: the hosted simulator's locale is fixed), taps it,
# and taps again while an enabled Done still shows. Never a retry keyed on
# Confirm not being visible: a stray tap at the confirm point would land on the
# Confirm hub.
- runFlow: ../subflows/photo-picker-banner.yaml
- tapOn:
    point: 16%,25%
- runFlow: ../subflows/photo-picker-done.yaml
# Wait for the fixed Vision suggestion to land: a screenshot of the analysing
# state would differ from run to run.
- extendedWaitUntil:
    visible:
      id: confirm-identity-resolved
    timeout: 90000
# The picked photo binds to the front slot a moment after the suggestion lands.
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__02-confirm
# Size and condition sit on the hub now; the Detaljer drill only holds Badge and Noter.
- tapOn:
    id: detail-size-m
- tapOn:
    id: detail-condition-used
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__03-size-and-condition
- extendedWaitUntil:
    visible:
      id: confirm-save
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__04-ready-to-save
- tapOn:
    id: confirm-save
- extendedWaitUntil:
    visible:
      id: post-save-to-collection
    timeout: 30000
# The Saved sheet's two exits: Tilføj næste trøje and Se samlingen.
- assertVisible:
    id: post-save-next
- assertVisible: "Tilføj næste trøje"
- assertVisible: "Se samlingen"
# The count line of the Saved sheet fills in after the sheet opens (a read that Save does not wait
# for): wait for it, or the screenshot differs from run to run. The number is not fixed by copy.
- extendedWaitUntil:
    visible: "Trøje nr\\. [0-9]+ i din samling"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey__05-saved
- tapOn:
    id: post-save-to-collection
- extendedWaitUntil:
    visible:
      id: collection-add
    timeout: 15000
# Scroll to the end of the grid: straight after the Sheet closes, the system tab
# bar has not always noticed the content beneath it, and draws itself two ways.
- scroll
- runFlow: ../subflows/settle.yaml
- takeScreenshot: kc__add-jersey__06-collection
- stopRecording
