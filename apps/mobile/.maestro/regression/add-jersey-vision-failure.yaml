# Tilføj trøje when Vision fails (the fixed Vision rejects every job, KIT-284): Confirm leaves the
# reading state for the empty identity block ("Vision fandt ikke trøjen", Vælg), and nothing is
# stuck. Vælg opens the Data drill. The picks inside the drill (club, season, type) have no
# testIDs, so the flow stops at the opened drill and does not Save.
appId: app.kitcollective.mobile
name: add-jersey-vision-failure
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_COLLECTOR_EMAIL}
      VISION: failure
- startRecording: kc__add-jersey-vision-failure
- tapOn:
    id: collection-add
- extendedWaitUntil:
    visible:
      id: capture-source-gallery
    timeout: 10000
- tapOn:
    id: capture-source-gallery
- tapOn: Fotos
# The system photo picker has no stable ids. The flows' simulator holds exactly
# one fixture photo, newest first: the first cell, then the confirm button.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 16%,25%
- tapOn:
    point: 90%,12%
- extendedWaitUntil:
    visible:
      id: photo-slot-front-filled
    timeout: 90000
# The reading state may show for a moment before the failure lands; let it pass if it does, and
# never screenshot it. A run where it is too short to see goes on after the wait times out.
- extendedWaitUntil:
    visible:
      id: confirm-identity-in-flight
    timeout: 4000
    optional: true
- extendedWaitUntil:
    visible:
      id: confirm-identity-empty
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: confirm-identity-in-flight
    timeout: 90000
- extendedWaitUntil:
    visible: "Vision fandt ikke trøjen"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey-vision-failure__01-empty-identity-block
# Vælg opens the Data drill, where club, season and type are chosen by hand.
- tapOn:
    id: confirm-identity-open
# The drill has no testID; its first row is the club select row (an assertion by copy, not a tap).
- extendedWaitUntil:
    visible: "Vælg klub eller landshold.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__add-jersey-vision-failure__02-data-drill
- stopRecording
