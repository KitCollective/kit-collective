# Ønsker for a Collector with no live Entitlement sells itself; its one button opens the paywall Sheet.
# The flow never taps Start gratis prøve, so the fixed peer user keeps an unused trial.
appId: app.kitcollective.mobile
name: wishlist-paywall
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_PEER_EMAIL}
- startRecording: kc__wishlist-paywall
- tapOn: Ønsker
- extendedWaitUntil:
    visible:
      id: wishlist-plus-cta
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__wishlist-paywall__01-wishlist
- tapOn:
    id: wishlist-plus-cta
- extendedWaitUntil:
    visible:
      id: paywall-sheet
    timeout: 15000
# The Sheet opens before the store answers. Wait for the price row, or the
# screenshot catches the price-less skeleton on some runs.
- extendedWaitUntil:
    visible:
      id: paywall-prices
    timeout: 30000
- runFlow: ../subflows/settle.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: kc__wishlist-paywall__02-paywall
- stopRecording
