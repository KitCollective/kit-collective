# Device flows (KIT-267, ADR-0048): build the iOS Simulator app, run the five
# Maestro flows against the staging lane, store screenshots and recordings in
# lane R2, and on a PR compare them with `development` and write the evidence.
#
# A red flow fails `flows`, which fails the check on the PR. `evidence` never
# fails the check over a design finding: findings are advisory.
#
# Variables come from the EAS `preview` environment; see docs/agents/device-flows.md.
name: Device flows

on:
  pull_request:
    branches:
      - development
    paths:
      - apps/mobile/**
  push:
    branches:
      - development

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build:
    name: Build simulator app
    type: build
    params:
      platform: ios
      profile: e2e

  flows:
    name: Maestro flows
    needs: [build]
    type: maestro
    environment: preview
    runs_on: macos-large
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: .maestro/flows
      record_screen: true
    hooks:
      before_maestro_tests:
        # Reduce Motion stills looping and entering animations, so the same
        # screen is the same picture on every run.
        - name: Still the simulator
          run: |
            xcrun simctl spawn booted defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES || true
            xcrun simctl status_bar booted override --time "9:41" --batteryState charged --batteryLevel 100 || true
      after_maestro_tests:
        - name: Store screenshots and recordings in lane R2
          if: ${{ always() }}
          run: |
            root="$(git rev-parse --show-toplevel)"
            node "$root/scripts/e2e/upload-run.mjs" "${{ github.sha }}" "$root" "$HOME/.maestro/tests"

  evidence:
    name: Compare and review
    after: [flows]
    environment: preview
    env:
      E2E_SHA: ${{ github.sha }}
      E2E_EVENT: ${{ github.event_name }}
      E2E_FLOWS_STATUS: ${{ after.flows.status }}
      E2E_REPOSITORY: ${{ github.repository }}
      E2E_PR_NUMBER: ${{ github.event.pull_request.number }}
      E2E_PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: eas/checkout
      - name: Record the run, compare with development, write the evidence
        run: node "$(git rev-parse --show-toplevel)/scripts/e2e/review-run.mjs"
