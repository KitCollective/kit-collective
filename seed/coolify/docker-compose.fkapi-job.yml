# FK / Football Kit Archive seed job (one-shot)
#
# Run only after Apify seed for the same competition + season range has populated
# Club and Season rows.
#
# Required secrets (development lane example):
#   DATABASE_URL — Postgres for the lane
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_ENDPOINT
#   FKAPI_BASE_URL, FKAPI_TOKEN — live Football Kit Archive listings (not fixture JSON)
#   SEED_PROXY_URL — when Football Kit Archive 202s from CX33 (same rule as Transfermarkt)
#   SEED_REQUIRE_PROXY — set true on Coolify; fail closed without SEED_PROXY_URL
#
# KitPhoto bytes are admin_only with rights unresolved — never public CDN / OG.

services:
  seed-fkapi-job:
    build:
      context: ../..
      dockerfile: seed/coolify/Dockerfile
    image: kit-collective-seed:latest
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      SEED_LANE: ${SEED_LANE:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      FKAPI_BASE_URL: ${FKAPI_BASE_URL:?FKAPI_BASE_URL is required}
      FKAPI_TOKEN: ${FKAPI_TOKEN:-}
      SEED_PROXY_URL: ${SEED_PROXY_URL:-}
      SEED_REQUIRE_PROXY: ${SEED_REQUIRE_PROXY:-true}
    command:
      - pnpm
      - --filter
      - "@kit/seed-fkapi"
      - exec
      - node
      - dist/cli.js
      - ${SEED_COMPETITION:?SEED_COMPETITION is required}
      - ${SEED_FROM_SEASON:?SEED_FROM_SEASON is required}
      - ${SEED_TO_SEASON:?SEED_TO_SEASON is required}
      - ${SEED_LANE:-development}
