# 24/7 FK listing HTTP (Coolify application, not a one-shot job).
#
# Service seed-fk-listing. Restart unless-stopped. PORT 8787.
# Process: node seed/fkapi/dist/listing-http.js
# Origin for FKAPI_BASE_URL (no /kits suffix). Not sunr4y/fkapi.
# Not docker-compose.fkapi-job.yml (that job ingest kit identity + archive bytes).
#
# GET /kits and GET /health stay unauthenticated (Join CLI).
# POST /ingest (Admin Fetch kits) needs Coolify env names (values in the same lane as Admin, not this file):
#   DATABASE_URL
#   R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   FK_LISTING_INGEST_TOKEN
# Production-lane ingest is refused by the seed mapper.
#
# Do not set the Seed proxy env, Decodo, or Coolify API names on this process.
# Decodo stays Transfermarkt-only. This host is Wayback listing ingest (ADR-0041).

services:
  seed-fk-listing:
    build:
      context: ../..
      dockerfile: seed/coolify/Dockerfile
    image: kit-collective-seed-fk-listing:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
    command:
      - node
      - seed/fkapi/dist/listing-http.js
