<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>Squad number history</title></head>
<body>
<!--
  Vendor markup for an empty squad-number box, taken verbatim from the national-team box of
  /rueckennummern/spieler/1197 and repeated for the club box. No player in the 24-page live
  sample had both boxes empty, so the club half is recombined rather than captured: the
  interesting part is that an empty box renders `span.empty` with no `table.items` at all.
-->
<h1 class="data-header__headline-wrapper">No History</h1>
<div class="box">
            <h2 class="content-box-headline">
                Squad number history            </h2>
            <p class="info-content">
                This statistic shows which shirt numbers the player has already worn in his career.            </p>
            <div class="responsive-table">
                <div id="yw1" class="grid-view">

<span class="empty">No entries available</span>
</div>            </div>
        </div>
<div class="box">
            <h2 class="content-box-headline">
                Squad number history in the national team            </h2>
            <p class="info-content">
                This statistic shows which kit numbers the player already wore during international caps.            </p>
            <div class="responsive-table">
                <div id="yw2" class="grid-view">

<span class="empty">No entries available</span>
</div>            </div>
        </div>
</body>
</html>
