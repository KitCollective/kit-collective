# KitCollective's software organisation in Paperclip. The one source of truth.
# Change it here only, then run `python3 paperclip/sync.py apply`. Never edit agents in Paperclip's UI: sync overwrites them.
# Job description per agent: org/<id>/INSTRUCTIONS.md
#
# Shape (docs: .scratch/paperclip-factory/):
#   CTO ─┬─ Tech Lead ─┬─ Fullstack Engineer
#        │             └─ DevOps Engineer
#        └─ QA Engineer ── Release Gate
# Delivery (Tech Lead and below) never judges its own work: QA and Release Gate sit in a separate line under the CTO.

[company]
name = "KitCollective"
issue_prefix = "KIT"
description = "Collector app for football kits. Software built by an agent loop on KitCollective's factory principles."
# Monthly cap for the whole company in cents. 0 = no cap. Subscription runs book 0 anyway.
budget_monthly_cents = 0

# Defaults for every claude_local agent. An agent may override any of them.
[defaults.claude]
engine = "cli"                       # Claude Code CLI, not ACP: loads the repo's .claude hooks and skills
dangerously_skip_permissions = true  # headless; the repo's hooks are the guard
timeout_sec = 3600
max_concurrent_runs = 1              # start with one run at a time on the shared server

# ── Agents ─────────────────────────────────────────────────────────────────
# model: always explicit (an empty model means Opus in claude_local). Never Fable.
# Every agent is created paused. `sync.py apply` never resumes an agent.

[[agents]]
id = "cto"
name = "CTO"
role = "cto"
title = "Chief Technology Officer"
icon = "crown"
reports_to = ""                      # reports to the board (Nicklas)
adapter = "claude_local"
model = "claude-sonnet-5-5"
capabilities = "Owns KitCollective's software: triage, priorities, roadmap with Nicklas, daily status and weekly factory report. Proposes one rule per week from repeated failures. Never writes code, never merges, never dispatches by itself."

[[agents]]
id = "tech-lead"
name = "Tech Lead"
role = "engineer"
title = "Tech Lead"
icon = "target"
reports_to = "cto"
adapter = "claude_local"
model = "claude-opus-5-5"
capabilities = "Plans one issue at a time: reads the issue, spec and repo, writes the plan, picks Fullstack or DevOps and the Engineer model. Never writes code."

[[agents]]
id = "fullstack"
name = "Fullstack Engineer"
role = "engineer"
title = "Fullstack Engineer"
icon = "code"
reports_to = "tech-lead"
adapter = "claude_local"
model = "claude-sonnet-5-5"          # the plan may set Opus per issue
effort = "high"
capabilities = "Implements one issue end to end in its own worktree: app, API, database and tests, with frontend and backend subagents. Pushes a branch and opens the PR. Also runs release promotions with the release skill."

[[agents]]
id = "devops"
name = "DevOps Engineer"
role = "devops"
title = "DevOps Engineer"
icon = "wrench"
reports_to = "tech-lead"
adapter = "claude_local"
model = "claude-opus-5-5"
effort = "high"
capabilities = "Infrastructure issues only: GitHub Actions, lanes and rulesets, Coolify, EAS channels and secrets. Every change goes to Approval."

[[agents]]
id = "qa"
name = "QA Engineer"
role = "qa"
title = "QA Engineer"
icon = "shield"
reports_to = "cto"                   # independent of Delivery
adapter = "claude_local"
model = "claude-opus-5-5"            # must differ from every Engineer model in the round; GLM via proxy later
capabilities = "Judges finished work on a different model than the Engineer: code review, acceptance criteria and, later, holdout scenarios. Ends with one AUDIT-RESULT line. Never edits code."

[[agents]]
id = "release-gate"
name = "Release Gate"
role = "devops"
title = "Release Gate"
icon = "git-branch"
reports_to = "qa"
adapter = "process"
# Runs one pipeline step per invoke and the exit code is the verdict. The step runner
# (`factory gate-run`) is not built yet, so the command refuses until it is.
command = "sh"
args = ["-c", "echo 'Release Gate is not wired yet: factory gate-run does not exist.' >&2; exit 1"]
timeout_sec = 2400
capabilities = "Runs the project's pipeline steps (gates, test-edit detection, auto-land) one per invoke; the exit code is the verdict. The only agent allowed to move an issue to Merging. No model."
