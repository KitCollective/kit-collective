name: feature
linearType: Feature
summary: Scout, plan, build, then open a PR and move to In Review, with evidence on the workpad.
steps:
  - scout
  - plan
  - build
  - code-gates
  - pr
  - in-review
codeGates:
  rebase: true
  typecheckTouchedPackages: true
  waitRequiredGithubChecks: true
  fullPnpmTest: github-actions
workpad:
  updateExisting: true
never:
  - merge
  - factory-checker-subagent
