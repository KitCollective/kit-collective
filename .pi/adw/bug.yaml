name: bug
linearType: Bug
summary: Repro, smallest fix, then open a PR and move to In Review, with evidence on the workpad.
steps:
  - scout
  - repro
  - fix
  - code-gates
  - pr
  - in-review
codeGates:
  rebase: true
  typecheckTouchedPackages: true
  waitRequiredGithubChecks: true
  fullPnpmTest: github-actions
workpad:
  updateExisting: true
never:
  - merge
  - factory-checker-subagent
