# Reviewed damage-control for the PI worker (KIT-53).
# Fail closed in non-interactive Compose. Do not apply @piagent/platform /onboard.
version: 2
settings:
  defaultAction: block
  parseFailure: block
  showStatus: true
rules:
  - id: path-env-secrets
    type: path:zeroAccess
    action: block
    reason: worker must not read or write .env (secrets stay in Compose env)
    match:
      path:
        any: [".env", ".env.*"]
        except: [".env.example"]
  - id: command-rm-rf
    type: command
    action: block
    reason: recursive delete is not allowed on the PI worker
    match:
      command: rm
      flags:
        any: ["-r", "-R", "--recursive"]
  - id: sql-drop-database
    type: command
    action: block
    reason: DROP DATABASE must never run from this box
    match:
      visibleTextAny: ["DROP DATABASE", "drop database"]
