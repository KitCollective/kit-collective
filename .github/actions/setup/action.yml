name: Setup workspace
description: pnpm, Node 22, frozen install and a Turbo build cache shared across runs.

inputs:
  turbo-cache-key:
    description: Distinguishes the Turbo cache of parallel jobs.
    default: default

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
