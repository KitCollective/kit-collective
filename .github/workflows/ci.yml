name: CI

on:
  push:
    branches: [development, staging, production, "cursor/**", "nicklas/**"]
  pull_request:
    branches: [development, staging, production]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_test
      API_TEST_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_api_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create API test database
        run: |
          PGPASSWORD=kit psql -h localhost -U kit -d kit_test -c "CREATE DATABASE kit_api_test;"

      - name: Build
        run: pnpm build

      - name: Check import boundaries
        run: pnpm check:imports

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_test
