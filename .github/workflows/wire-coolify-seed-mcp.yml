name: Wire Coolify Seed MCP

on:
  workflow_dispatch:

jobs:
  wire:
    name: Wire Seed MCP (development)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Require Coolify host credentials and ingest token
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_MCP_TOKEN: ${{ secrets.SEED_MCP_TOKEN }}
        run: |
          set -euo pipefail
          for name in COOLIFY_API_URL DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Environment secret ${name} on development"
              exit 1
            fi
          done
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Environment secret COOLIFY_API_TOKEN on development"
            exit 1
          fi
          if [ -z "${SEED_MCP_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Environment secret SEED_MCP_TOKEN on development"
            exit 1
          fi

      - name: Ensure Seed MCP application exists and is configured
        env:
          SEED_LANE: development
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_STAGING_DATABASE_URL: ${{ secrets.SEED_STAGING_DATABASE_URL }}
          SEED_MCP_TOKEN: ${{ secrets.SEED_MCP_TOKEN }}
          SEED_PROXY_URL: ${{ secrets.SEED_PROXY_URL }}
          SEED_REQUIRE_PROXY: ${{ secrets.SEED_REQUIRE_PROXY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FKAPI_BASE_URL: ${{ secrets.FKAPI_BASE_URL }}
          FKAPI_TOKEN: ${{ secrets.FKAPI_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GIT_REPOSITORY: KitCollective/kit-collective
        run: bash seed/coolify/wire-mcp.sh
