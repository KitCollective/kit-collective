name: Deploy API

on:
  push:
    branches: [staging, production]
    paths:
      - "apps/api/**"
      - "packages/api-contract/**"
      - "packages/db/**"
      - "packages/domain/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [development]
    paths:
      - "apps/api/**"
      - "packages/api-contract/**"
      - "packages/db/**"
      - "packages/domain/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      lane:
        description: Target lane environment
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  verify-image:
    name: Verify API image (${{ github.event_name == 'workflow_dispatch' && inputs.lane || (github.event_name == 'pull_request' && 'staging' || github.ref_name) }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'development' || github.event_name == 'workflow_dispatch' && inputs.lane || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t kit-api:${{ github.sha }} .

      - name: Assert seed/ is not in the image
        run: |
          if docker run --rm --entrypoint sh kit-api:${{ github.sha }} -c "test ! -e /app/seed && test ! -e /seed"; then
            echo "seed/ absent from image"
          else
            echo "seed/ must not be present in the API image" >&2
            exit 1
          fi

      - name: Smoke health + catalog stats in container
        env:
          DATABASE_URL: postgresql://kit:kit@postgres:5432/kit_deploy_test
          # CI-only — Nest Identity requires BETTER_AUTH_* at boot.
          BETTER_AUTH_SECRET: ci-test-better-auth-secret-not-for-production
          BETTER_AUTH_URL: http://127.0.0.1:3000
        run: |
          docker network create kit-deploy-test
          docker run -d --name postgres --network kit-deploy-test \
            -e POSTGRES_USER=kit -e POSTGRES_PASSWORD=kit -e POSTGRES_DB=kit_deploy_test \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U kit -d kit_deploy_test; then
              break
            fi
            sleep 1
          done
          docker run -d --name kit-deploy-api --network kit-deploy-test \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET}" \
            -e BETTER_AUTH_URL="${BETTER_AUTH_URL}" \
            -p 13000:3000 kit-api:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:13000/v1/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:13000/v1/health | grep -q '"database":"ok"'
          curl -fsS http://127.0.0.1:13000/v1/catalog/stats | grep -q '"countries":0'
          docker stop postgres kit-deploy-api
          docker rm postgres kit-deploy-api
          docker network rm kit-deploy-test

  coolify-deploy:
    name: Trigger Coolify deploy (${{ github.event_name == 'workflow_dispatch' && inputs.lane || github.ref_name }})
    runs-on: ubuntu-latest
    needs: verify-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || github.ref_name }}
    steps:
      - name: Resolve deploy webhook
        id: webhook
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "${COOLIFY_DEPLOY_WEBHOOK_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when deploy webhook is not configured
        if: steps.webhook.outputs.configured != 'true'
        run: echo "COOLIFY_DEPLOY_WEBHOOK_URL not set; skipping Coolify trigger."

      - name: Trigger Coolify webhook
        if: steps.webhook.outputs.configured == 'true'
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        run: curl -fsS -X POST "${COOLIFY_DEPLOY_WEBHOOK_URL}"
