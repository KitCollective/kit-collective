name: Device flows

# Runs the Maestro Device flows on a hosted iOS Simulator, so a slice's flow does
# not need the approver's Mac (ADR-0059).
#
# It reuses the local scripts (ADR-0049) with the device lock switched off
# (the runner is a fresh machine per run): build-local.sh for the cached native
# binary plus this commit's JavaScript, local-api.sh for the API on a disposable
# Postgres, run-local.sh for the flows. Screenshots and recordings are uploaded
# as a run artifact.
#
# A slice run on a PR sets the `Device flows` commit status on the PR head
# (pending, then success, failure or error), linked to this run. The pre-review
# gate waits for that status when the PR holds the issue's slice flow. The status
# is not a required check: it cannot be limited to mobile PRs (ADR-0048).
#
# Not done here: the before/after comparison, the Claude review, the PR comment
# and the Linear workpad links of run-evidence.sh. They need the evidence bucket
# and the approver's logins; a local `device-run.sh` still produces them.
#
# Triggers:
#   - nightly: the five regression flows against `development` (no status)
#   - label `run-device-flows` on a PR: that issue's slice flow (issue key from the
#     branch name, e.g. claude/kit-279-59e33d). `node scripts/request-device-flows.mjs`
#     sets the label; a new head needs the label set again.
#   - manual: pick regression or slice (and an issue key; no status)
#   - manual, flows: artifact: one flow taken from a named run artifact, for example
#     one `scenario-flow.yml` made (KIT-352, ADR-0060). It runs exactly as a slice
#     run does, sets no status and commits nothing; the flow is never in the repo.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      flows:
        description: Which flows to run
        type: choice
        options: [regression, slice, artifact]
        default: regression
      issue:
        description: Issue key for a slice run, for example KIT-279
        required: false
        type: string
      flow_run:
        description: For an artifact run, the id of the run that holds the flow
        required: false
        type: string
      flow_artifact:
        description: For an artifact run, the artifact's name, for example scenario-flow-scenario-smoke
        required: false
        type: string
      flow:
        description: For an artifact run, the flow file in the artifact; empty when it holds one
        required: false
        type: string
  pull_request:
    types: [labeled]
    branches: [development]

# An artifact run is its own group: several runs of one flow on one commit (the
# Scenario judge runs each Scenario more than once) must not cancel each other or the nightly.
concurrency:
  group: device-flows-${{ inputs.flows == 'artifact' && format('artifact-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  # Reading another run's artifact (flows: artifact).
  actions: read

jobs:
  ios:
    name: iOS Simulator
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-device-flows'
    runs-on: macos-latest
    # A run that has to build the native binary took 41 minutes once and 58 the next time (the
    # second one was cancelled at 60, in the flow step). A cache hit needs a fraction of this.
    timeout-minutes: 90
    env:
      # Local-only test values (see apps/mobile/.maestro/local.env.sh); the database
      # is disposable and lives on this runner only.
      E2E_LOCK_HELD: "1"
      E2E_LOCAL_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_e2e_test
      E2E_FLOWS: ${{ (github.event_name == 'schedule' || inputs.flows == 'regression') && 'regression' || inputs.flows == 'artifact' && 'artifact' || 'slice' }}
      E2E_ISSUE: ${{ inputs.issue }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      GH_TOKEN: ${{ github.token }}
      # Only a PR's slice run speaks for a head; the nightly and manual runs (artifact runs
      # included) set no status.
      STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Device flows status, pending
        if: env.STATUS_SHA != ''
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -f context="Device flows" \
            -f state=pending -f description="Running on the hosted iOS Simulator" -f target_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PR run tests the PR head, not the merge ref: the evidence scripts
          # key everything by the commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # build-local.sh and run-local.sh read the branch name for the slice key.
      - name: Check out a named branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git switch -c "$HEAD_REF"

      # Before the API and the build, so a bad artifact fails in seconds. The flow sits one
      # level under .maestro, like slices/, so `../subflows/sign-in.yaml` resolves.
      - name: Check the flow artifact inputs
        if: env.E2E_FLOWS == 'artifact'
        env:
          FLOW_RUN: ${{ inputs.flow_run }}
          FLOW_ARTIFACT: ${{ inputs.flow_artifact }}
          FLOW: ${{ inputs.flow }}
        run: |
          [[ "$FLOW_RUN" =~ ^[0-9]+$ ]] || { echo "flow_run must be a run id (digits)." >&2; exit 2; }
          [[ "$FLOW_ARTIFACT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "flow_artifact must be an artifact name." >&2; exit 2; }
          [[ -z "$FLOW" || "$FLOW" =~ ^[a-z0-9][a-z0-9-]*\.ya?ml$ ]] || { echo "flow must be a file name like scenario-smoke.yaml." >&2; exit 2; }

      - name: Download the flow artifact
        if: env.E2E_FLOWS == 'artifact'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.flow_run }}
          name: ${{ inputs.flow_artifact }}
          github-token: ${{ github.token }}
          path: apps/mobile/.maestro/external

      # build-local.sh (through simulator.sh) and run-local.sh read E2E_FLOW_FILE, so the app
      # lands on the simulator the flow drives, with the photos the flow's header names.
      - name: Name the flow file
        if: env.E2E_FLOWS == 'artifact'
        env:
          FLOW: ${{ inputs.flow }}
        run: |
          dir="$GITHUB_WORKSPACE/apps/mobile/.maestro/external"
          if [[ -z "$FLOW" ]]; then
            # The macOS runner's /bin/bash is 3.2: no mapfile.
            flows=()
            while IFS= read -r found; do flows+=("$found"); done \
              < <(find "$dir" -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
            if [[ "${#flows[@]}" -ne 1 ]]; then
              echo "The artifact holds ${#flows[@]} flow files; name one with the flow input." >&2
              exit 2
            fi
            file="${flows[0]}"
          else
            file="$dir/$FLOW"
          fi
          [[ -f "$file" ]] || { echo "The artifact has no $FLOW." >&2; exit 2; }
          echo "Flow from the artifact: ${file#"$dir"/}"
          echo "E2E_FLOW_FILE=$file" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        # TODO pin a version once one is chosen; the installer takes MAESTRO_VERSION.
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
          for _ in $(seq 1 30); do
            "$(brew --prefix postgresql@16)/bin/pg_isready" -q && break
            sleep 1
          done
          "$(brew --prefix postgresql@16)/bin/createuser" -s kit
          "$(brew --prefix postgresql@16)/bin/psql" -d postgres -c "ALTER USER kit PASSWORD 'kit';"
          "$(brew --prefix postgresql@16)/bin/createdb" -O kit kit_e2e_test

      # The native binary is keyed by the same hash build-local.sh uses (lockfile,
      # native config, Xcode version), so a cache hit means JavaScript only.
      - name: Native binary cache key
        id: native
        run: |
          cd apps/mobile/.maestro
          # shellcheck disable=SC1091
          stamp="$(source ./source-stamp.sh && source ./native-cache.sh && native_stamp)"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps: `actions/cache` saves only when the whole
      # job succeeds, so a red flow threw away a 40 minute native build every time.
      - name: Restore native binary
        id: native-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kit-e2e/native
          key: kit-e2e-native-${{ runner.os }}-${{ steps.native.outputs.stamp }}

      - name: Start the local API
        run: |
          apps/mobile/.maestro/local-api.sh > "$RUNNER_TEMP/local-api.log" 2>&1 &
          for _ in $(seq 1 180); do
            curl -fsS http://localhost:3000/v1/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "The local API did not become healthy:" >&2
          tail -40 "$RUNNER_TEMP/local-api.log" >&2
          exit 1

      - name: Build the Simulator app
        id: build
        run: apps/mobile/.maestro/build-local.sh

      - name: Save native binary
        if: always() && steps.build.outcome == 'success' && steps.native-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kit-e2e/native
          key: kit-e2e-native-${{ runner.os }}-${{ steps.native.outputs.stamp }}

      - name: Run the flows
        id: flows
        # An artifact run names its one flow; the others pick theirs from E2E_FLOWS and the branch.
        run: apps/mobile/.maestro/run-local.sh ${E2E_FLOW_FILE:+"$E2E_FLOW_FILE"}
        env:
          # Milliseconds Maestro waits for its iOS driver. Its default is 120000 (cli-2.11.0);
          # run 38801470319 hit IOSDriverTimeoutException on a cold runner, before any flow step.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"

      - name: Upload screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named after the commit the flows ran on. On a PR run github.sha is the merge
          # commit GitHub made, which no reviewer can know; the head is what the status names.
          name: device-flows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/mobile/.maestro/out
            ${{ runner.temp }}/local-api.log
          retention-days: 14
          if-no-files-found: warn

      # Always the last word: a run that stopped before the flows must not leave the head pending.
      - name: Device flows status, verdict
        if: always() && env.STATUS_SHA != ''
        env:
          FLOWS: ${{ steps.flows.outcome }}
        run: |
          case "$FLOWS" in
            success) state=success; description="The slice flow passed on the hosted iOS Simulator" ;;
            failure) state=failure; description="The slice flow failed; screenshots are in the run artifact" ;;
            *) state=error; description="The run stopped before the flow finished" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -f context="Device flows" \
            -f state="$state" -f description="$description" -f target_url="$RUN_URL" >/dev/null
