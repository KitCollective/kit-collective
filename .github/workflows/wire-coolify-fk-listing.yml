name: Wire Coolify FK listing HTTP

on:
  workflow_dispatch:

jobs:
  wire:
    name: Wire FK listing HTTP (development)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Require Coolify host credentials
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in COOLIFY_API_URL COOLIFY_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Environment secret ${name} on development"
              exit 1
            fi
          done

      - name: Ensure FK listing HTTP application exists and is configured
        env:
          SEED_LANE: development
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          GIT_REPOSITORY: KitCollective/kit-collective
          GIT_REF: ${{ github.ref_name }}
        run: bash seed/coolify/wire-fk-listing.sh
